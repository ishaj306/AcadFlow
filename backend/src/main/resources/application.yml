spring:
  application:
    name: batchmaker-backend

  profiles:
    default: dev

  datasource:
    # Embedded H2, file-backed so data survives restarts. Swap to the "postgres"
    # profile (see application-postgres.yml) for a server-based deployment.
    url: jdbc:h2:file:./data/batchmaker;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: batchmaker-pool
      maximum-pool-size: 10

  jpa:
    # Flyway owns the schema; Hibernate only validates that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: INFO
    edu.batchmaker: INFO
    org.hibernate.SQL: WARN

batchmaker:
  # HS256 signing key for JWTs. Override in any real deployment via
  # BATCHMAKER_SECURITY_JWT_SECRET; must be at least 32 bytes.
  security:
    jwt:
      secret: "dev-only-change-me-batchmaker-timetable-signing-key-2026"
      issuer: batchmaker
      access-token-minutes: 480
  solver:
    base-url: http://127.0.0.1:8090
    connect-timeout-seconds: 10
    read-timeout-seconds: 180
    # If the solver service is unreachable, fall back to the in-JVM heuristic
    # scheduler so the application still functions (with a warning on the result).
    fallback-enabled: true
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174
      - http://localhost:5175
      - http://127.0.0.1:5173
      - http://127.0.0.1:5174
      - http://127.0.0.1:5175
  bootstrap:
    # On an empty database the application creates the four roles and this one
    # administrator account - nothing else. Every department, subject,
    # laboratory, faculty member and student is entered by you.
    admin-username: admin
    admin-full-name: System Administrator
    admin-email: admin@localhost
    # Leave blank to have a strong password generated and printed once to the
    # startup log. Override via BATCHMAKER_BOOTSTRAP_ADMIN_PASSWORD.
    admin-password: ""
